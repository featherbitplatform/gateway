routes:
  - name: bench
    match:
      path: /bench/*
    policy: jwt

policies:
  - name: jwt
    nodes:
      - id: listener
        type: listener
      - id: auth
        type: jwt-auth
        config:
          secret: "@@JWT_SECRET@@"
          algorithm: HS256
          header_name: authorization
      - id: backend
        type: upstream
        config:
          targets:
            - host: "@@UPSTREAM_HOST@@"
              port: @@UPSTREAM_PORT@@
      - id: client
        type: client
    edges:
      - from: listener.out
        to: auth.in
      - from: auth.success
        to: backend.in
      - from: auth.denied
        to: client.in
      - from: backend.success
        to: client.in
