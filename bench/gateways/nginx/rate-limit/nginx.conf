# limit_req that never trips at benchmark load; /limited/ allows 1 request per minute.
worker_processes @@CORES@@;
worker_rlimit_nofile 1048576;
error_log /dev/stderr warn;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 300s;
    keepalive_requests 1000000;

    upstream backend {
        server @@UPSTREAM_HOST@@:@@UPSTREAM_PORT@@;
        keepalive 512;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    limit_req_zone $binary_remote_addr zone=bench:10m rate=10000000r/s;
    limit_req_zone $binary_remote_addr zone=probe:1m rate=1r/m;
    limit_req_status 429;

    server {
        listen 8000 reuseport backlog=65535;
        location /bench/ {
            limit_req zone=bench burst=10000000 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location /limited/ {
            limit_req zone=probe;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
