_format_version: "3.0"
services:
  - name: bench
    url: http://@@UPSTREAM_HOST@@:@@UPSTREAM_PORT@@
    routes:
      - name: bench
        paths: ["/bench/"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]
consumers:
  - username: bench
    jwt_secrets:
      - key: "@@JWT_ISSUER@@"
        secret: "@@JWT_SECRET@@"
        algorithm: HS256
