upstreams:
  - id: 1
    type: roundrobin
    scheme: http
    pass_host: pass
    nodes:
      "@@UPSTREAM_HOST@@:@@UPSTREAM_PORT@@": 1
routes:
  - id: bench
    uri: /bench/*
    upstream_id: 1
    plugins:
      proxy-rewrite:
        headers:
          set:
            X-Bench-Added: "1"
            X-Bench-Added2: "2"
      response-rewrite:
        headers:
          remove:
            - X-Bench-Remove
#END
