name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Unit + integration tests (621, inline in src/) and lints.
  rust:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The admin UI is embedded into the binary at compile time via rust-embed,
      # and ui/dist is gitignored -- so it must be built before cargo, or the
      # build embeds nothing. (This is the same trap that shipped a stale UI.)
      - name: Build the embedded UI
        run: npm ci && npm run build
        working-directory: ui

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The tree is rustfmt-clean today; keep it that way.
      - run: cargo fmt --check

      - run: cargo test --locked

      # The tree is clippy-clean today; keep it that way.
      - run: cargo clippy --all-targets --locked -- -D warnings

  # Live-backend tests against real RESP servers. The env-gated tests
  # (FEATHERBIT_TEST_REDIS_URL) self-skip in every other job; here they run,
  # once per backend, proving the redis AND valkey claims. No UI build needed:
  # redis-store without the ui feature.
  redis-live:
    name: redis live tests (${{ matrix.backend.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - { name: redis-7, image: "redis:7" }
          - { name: valkey-8, image: "valkey/valkey:8" }
    services:
      redis:
        image: ${{ matrix.backend.image }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping || valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked --no-default-features --features redis-store
        env:
          FEATHERBIT_TEST_REDIS_URL: redis://127.0.0.1:6379

  # Real ACME issuance against Pebble (Let's Encrypt's test CA). Host networking
  # lets Pebble's validator reach the test's listener on 127.0.0.1:18443; the
  # test self-skips everywhere FEATHERBIT_TEST_PEBBLE_URL is unset.
  acme-live:
    name: acme live tests (pebble)
    runs-on: ubuntu-latest
    # The scenario runs once per storage backend; the redis service is what
    # enables the `stores:`-backed half of it.
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping || valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Start Pebble
        run: |
          curl -fsSL -o /tmp/pebble.minica.pem \
            https://raw.githubusercontent.com/letsencrypt/pebble/main/test/certs/pebble.minica.pem
          docker run -d --name pebble --network host \
            -e PEBBLE_VA_NOSLEEP=1 \
            -v "$PWD/dev/pebble/pebble-config.json:/test/config/pebble-config.json:ro" \
            ghcr.io/letsencrypt/pebble:latest -config /test/config/pebble-config.json -strict
          for i in $(seq 1 30); do
            curl -sk https://localhost:14000/dir >/dev/null && break
            sleep 1
          done
          curl -sk https://localhost:14000/dir

      - run: "cargo test --locked --no-default-features --features redis-store acme:: -- --nocapture"
        env:
          FEATHERBIT_TEST_PEBBLE_URL: https://localhost:14000/dir
          FEATHERBIT_TEST_PEBBLE_CA: /tmp/pebble.minica.pem
          FEATHERBIT_TEST_ACME_DOMAIN: localhost
          FEATHERBIT_TEST_ACME_PORT: "18443"
          FEATHERBIT_TEST_REDIS_URL: redis://127.0.0.1:6379

      - name: Pebble logs
        if: failure()
        run: docker logs pebble

  # The headless build (no `ui` feature, no ui/dist needed) must keep
  # compiling — it ships as the -headless Docker variant.
  headless-check:
    name: cargo check (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --no-default-features --locked

      # Clippy must stay clean on the headless combo too (-D warnings).
      - run: cargo clippy --all-targets --no-default-features --locked -- -D warnings

  # ESLint + vitest over the admin UI. The tree is eslint-clean (errors and
  # warnings); keep it that way.
  ui-lint:
    name: eslint + vitest (ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci && npm run lint && npm test
        working-directory: ui

  # The Playwright suite: admin API + data plane + web UI. See E2E_TESTBOOK.md.
  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            e2e/package-lock.json

      - name: Build the embedded UI
        run: npm ci && npm run build
        working-directory: ui

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The suite runs the release binary (see e2e/playwright.config.ts).
      - name: Build the gateway
        run: cargo build --release --locked

      - name: Install e2e deps
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Start Pebble
        run: |
          curl -fsSL -o /tmp/pebble.minica.pem \
            https://raw.githubusercontent.com/letsencrypt/pebble/main/test/certs/pebble.minica.pem
          docker run -d --name pebble --network host \
            -e PEBBLE_VA_NOSLEEP=1 \
            -v "$PWD/dev/pebble/pebble-config.json:/test/config/pebble-config.json:ro" \
            ghcr.io/letsencrypt/pebble:latest -config /test/config/pebble-config.json -strict
          for i in $(seq 1 30); do
            curl -sk https://localhost:14000/dir >/dev/null && break
            sleep 1
          done
          curl -sk https://localhost:14000/dir

      # Playwright boots everything itself: the gateway, the Python echo backend
      # (python3 is preinstalled; the config resolves it per platform), and the
      # Node mock services (OIDC provider, the HTTP auth mock, and an ldapjs
      # LDAP server). The redis service unlocks the gated E2E-SESS scenarios;
      # the Pebble service unlocks the gated E2E-ACME scenarios; everything
      # else remains process-local.
      - name: Run e2e
        run: npm test
        working-directory: e2e
        env:
          FEATHERBIT_TEST_REDIS_URL: redis://127.0.0.1:6379
          FEATHERBIT_TEST_PEBBLE_URL: https://localhost:14000/dir
          FEATHERBIT_TEST_PEBBLE_CA: /tmp/pebble.minica.pem
          FEATHERBIT_TEST_ACME_DOMAIN: localhost
          FEATHERBIT_TEST_ACME_PORT: "18443"
          FEATHERBIT_TEST_REDIS_URL: redis://127.0.0.1:6379

      # The report carries traces, screenshots and the failing scenario IDs --
      # the only way to diagnose a browser failure after the fact.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
