name: Deploy docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            website/package-lock.json

      # rust-embed compiles ui/dist into the binary and ui/dist is gitignored,
      # so the UI must be built before ANY cargo invocation -- including
      # cargo doc (same trap as in ci.yml).
      - name: Build the embedded UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build rustdoc
        run: cargo doc --no-deps --document-private-items

      - name: Build TypeDoc
        working-directory: ui
        run: npm run docs

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      # CycloneDX SBOMs served by the site (see website/docs/reference/sbom.md),
      # one per source component so each file states which part of the product
      # it covers. All are stamped with the gateway version — the components
      # version together (ui/website package.json versions are placeholders).
      # The image SBOM is published as a release asset instead (docker.yml).
      - name: Generate SBOMs
        run: |
          mkdir -p website/static/sbom
          syft="${{ steps.syft.outputs.cmd }}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          "$syft" scan file:Cargo.lock \
            --source-name featherbit-gateway --source-version "$version" \
            -o cyclonedx-json=website/static/sbom/featherbit-gateway.cdx.json
          "$syft" scan file:ui/package-lock.json \
            --source-name featherbit-ui --source-version "$version" \
            -o cyclonedx-json=website/static/sbom/featherbit-ui.cdx.json
          "$syft" scan file:website/package-lock.json \
            --source-name featherbit-website --source-version "$version" \
            -o cyclonedx-json=website/static/sbom/featherbit-website.cdx.json

      - name: Build site
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
