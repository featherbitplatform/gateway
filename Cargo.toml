[package]
name = "featherbit"
version = "0.1.0"
edition = "2021"
# Not published to crates.io; also lets cargo-deny's license check skip the
# workspace crate (deny.toml: private = { ignore = true }).
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
thiserror = "2"
base64 = "0.22"

# Admin API
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }

# Plugins
dashmap = "6"
jsonwebtoken = "9"
governor = "0.8"

# Hot reload
notify = "7"

# Metrics
# 0.14 drops the protobuf 2.x dependency (RUSTSEC-2024-0437); only the text
# encoder + core collector types are used, which are unchanged.
prometheus = "0.14"

# Embedded UI
rust-embed = "8"
mime_guess = "2"

# Lua scripting
mlua = { version = "0.10", features = ["luau", "serialize"] }
ipnet = "2.12.0"
# Pinned to the ring provider (default features pull in aws-lc-rs, which we
# don't use — the whole tree is ring). Keeps aws-lc-sys out of the build.
hyper-rustls = { version = "0.27.9", default-features = false, features = ["native-tokio", "http1", "http2", "tls12", "logging", "ring"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# TLS termination on the data-plane/admin listeners. tokio-rustls 0.26 pairs with
# rustls 0.23; pinned to the ring provider (no aws-lc-rs) like the rest of the tree.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
# Native root store for verifying upstream TLS (wss/https to backends).
rustls-native-certs = "0.8"
# X.509 parsing for mTLS client identity (CN/SAN); already in the tree via ldap3.
x509-parser = "0.18"
arc-swap = "1.9.2"
flate2 = "1.1.9"
brotli = "8.0.4"
jsonschema = { version = "0.47.0", default-features = false }
ring = "0.17.14"
casbin = "2.20.0"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
# etcd config store (HA clustering) talks to etcd's v3 HTTP/JSON gateway via the
# shared outbound client — no gRPC/protoc/tonic dependency required.

[dev-dependencies]
# http2 + rustls-tls so the in-process TLS test reliably negotiates h2 via ALPN
# (native-tls/schannel does not on Windows). aws-lc-rs is already in the tree.
reqwest = { version = "0.12", features = ["json", "http2", "rustls-tls"] }
tokio-test = "0.4"
# Self-signed certs for TLS listener tests (ring-based, emits PEM).
rcgen = "0.13"
# WebSocket echo upstream + client for the in-process WS proxy test
# (versions already in the tree via axum, so they unify — no second copy).
tokio-tungstenite = "0.28"
futures-util = "0.3"
