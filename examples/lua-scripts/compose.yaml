# Lua scripts in a routing policy.
#
#   docker compose -f examples/lua-scripts/compose.yaml up
#   curl -si http://localhost:8080/api/users | grep -iE 'x-request-id|x-response-time'
#   curl -si -A 'scrapy/2.0' http://localhost:8080/api/users | head -1      # 403 from block-user-agents.lua (the script answers on its `respond` port)
#
# `plugins/` is mounted at /etc/gateway/plugins, which is where the `script`
# nodes in config/gateway.yaml point (`source: /etc/gateway/plugins/<file>.lua`).
# Edit a script on the host and the next request runs the new version -- the
# policy file is hot-reloaded and scripts are read when the policy compiles.

services:
  gateway:
    image: featherbit/featherbit:${FEATHERBIT_TAG:-latest}
    command:
      - --system-config=/etc/gateway/system.yaml
      - --gateway-config=/etc/gateway/gateway.yaml
    ports:
      - "8080:8080" # data plane
      - "9090:9090" # admin API + web UI (admin/admin)
    volumes:
      - ./config:/etc/gateway:ro
      - ./plugins:/etc/gateway/plugins:ro
    environment:
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
      UPSTREAM_HOST: whoami
      UPSTREAM_PORT: "80"
      LOG_LEVEL: info
    depends_on:
      - whoami

  whoami:
    image: traefik/whoami:v1.10
