# Routes and policies. Hot-reloaded: edit this file on the host and the running
# gateway picks the change up without a restart.
#
# The `script` nodes point at /etc/gateway/plugins, where compose.yaml mounts
# ../plugins. See ../plugins/README.md for what each script does.

routes:
  - name: scripted-api
    match:
      path: /api/*
      methods: [GET, POST, PUT, DELETE]
    policy: scripted-policy

policies:
  - name: scripted-policy
    error_handler: error-handler
    nodes:
      - id: listener
        type: listener

      # Lua: add a unique request ID
      - id: request-id
        type: script
        config:
          runtime: lua
          source: /etc/gateway/plugins/add-request-id.lua

      # Lua: reject known bot user agents. The script prepares the 403 and
      # returns `ctx, "respond"`, so the node leaves on `respond` (wired to
      # client below) and the upstream never runs.
      - id: block-bots
        type: script
        config:
          runtime: lua
          source: /etc/gateway/plugins/block-user-agents.lua

      # Lua: start the response timer
      - id: timer-start
        type: script
        config:
          runtime: lua
          source: /etc/gateway/plugins/response-timer.lua

      # Strip the /api prefix before forwarding
      - id: rewrite
        type: proxy-rewrite
        config:
          phase: request
          strip_path_prefix: /api

      # Forward to the backend
      - id: backend
        type: upstream
        config:
          targets:
            - host: ${UPSTREAM_HOST:-whoami}
              port: ${UPSTREAM_PORT:-80}

      # Lua: stop the response timer, add X-Response-Time header
      - id: timer-end
        type: script
        config:
          runtime: lua
          source: /etc/gateway/plugins/response-timer.lua


      - id: error-handler
        type: error-handler
        config:
          status_code: 502
          body_template: '{"error": "{{error.code}}", "message": "{{error.message}}"}'

      - id: client
        type: client

    edges:
      - from: listener.out
        to: request-id.in
      # mandatory on every script node; this script never takes it
      - from: request-id.respond
        to: client.in
      - from: request-id.success
        to: block-bots.in
      - from: block-bots.respond
        to: client.in
      - from: block-bots.success
        to: timer-start.in
      # mandatory on every script node; this script never takes it
      - from: timer-start.respond
        to: client.in
      - from: timer-start.success
        to: rewrite.in
      - from: rewrite.success
        to: backend.in
      - from: backend.success
        to: timer-end.in
      # mandatory on every script node; this script never takes it
      - from: timer-end.respond
        to: client.in
      - from: timer-end.success
        to: client.in
      - from: backend.error
        to: error-handler.in
      - from: error-handler.success
        to: client.in
