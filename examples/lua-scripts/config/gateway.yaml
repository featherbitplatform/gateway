# Routes and policies. Hot-reloaded: edit this file on the host and the running
# gateway picks the change up without a restart.
#
# The `script` nodes point at /etc/gateway/plugins, where compose.yaml mounts
# ../plugins. See ../plugins/README.md for what each script does.

routes:
  - name: scripted-api
    match:
      path: /api/*
      methods: [GET, POST, PUT, DELETE]
    policy: scripted-policy

policies:
  - name: scripted-policy
    error_handler: error-handler
    nodes:
      - id: listener
        type: listener

      # Lua: add a unique request ID
      - id: request-id
        type: script
        config:
          runtime: lua
          source: /etc/gateway/plugins/add-request-id.lua

      # Lua: flag known bot user agents in ctx.message.blocked_ua. A script
      # cannot reject by writing the response -- the upstream would replace
      # it -- so the next two nodes branch on the flag and answer 403.
      - id: block-bots
        type: script
        config:
          runtime: lua
          source: /etc/gateway/plugins/block-user-agents.lua

      - id: is-bot
        type: condition
        config:
          conditions:
            - ["msg_blocked_ua", "!=", ""]

      - id: reject
        type: response-rewrite
        config:
          status_code: 403
          body: '{"error": "forbidden", "message": "Blocked user agent"}'
          headers:
            set:
              content-type: application/json

      # Lua: start the response timer
      - id: timer-start
        type: script
        config:
          runtime: lua
          source: /etc/gateway/plugins/response-timer.lua

      # Strip the /api prefix before forwarding
      - id: rewrite
        type: proxy-rewrite
        config:
          phase: request
          strip_path_prefix: /api

      # Forward to the backend
      - id: backend
        type: upstream
        config:
          targets:
            - host: ${UPSTREAM_HOST:-whoami}
              port: ${UPSTREAM_PORT:-80}

      # Lua: stop the response timer, add X-Response-Time header
      - id: timer-end
        type: script
        config:
          runtime: lua
          source: /etc/gateway/plugins/response-timer.lua


      - id: error-handler
        type: error-handler
        config:
          status_code: 502
          body_template: '{"error": "{{error.code}}", "message": "{{error.message}}"}'

      - id: client
        type: client

    edges:
      - from: listener.out
        to: request-id.in
      - from: request-id.success
        to: block-bots.in
      - from: block-bots.success
        to: is-bot.in
      - from: is-bot.true
        to: reject.in
      - from: reject.success
        to: client.in
      - from: is-bot.false
        to: timer-start.in
      - from: timer-start.success
        to: rewrite.in
      - from: rewrite.success
        to: backend.in
      - from: backend.success
        to: timer-end.in
      - from: timer-end.success
        to: client.in
      - from: backend.error
        to: error-handler.in
      - from: error-handler.success
        to: client.in
