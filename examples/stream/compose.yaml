# L4 stream proxying next to the HTTP data plane.
#
#   docker compose -f examples/stream/compose.yaml up
#   curl http://localhost:8080/api/users   # HTTP plane: routes, policies, plugins
#   curl http://localhost:8081/users       # TCP stream: raw bytes relayed to whoami
#
# A `stream:` entry in config/system.yaml binds a port at startup and proxies
# raw TCP (or UDP) to a load-balanced pool -- no routes, no policies, no
# plugins, no HTTP parsing. The same whoami container answers both: on :8080
# the policy strips the /api prefix before forwarding; on :8081 the bytes are
# relayed untouched, so the path arrives exactly as you sent it.

services:
  gateway:
    image: featherbit/featherbit:${FEATHERBIT_TAG:-latest}
    command:
      - --system-config=/etc/gateway/system.yaml
      - --gateway-config=/etc/gateway/gateway.yaml
    ports:
      - "8080:8080" # HTTP data plane
      - "8081:8081" # TCP stream -> whoami:80
      - "9090:9090" # admin API + web UI (admin/admin)
    volumes:
      - ./config:/etc/gateway:ro
    environment:
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
      UPSTREAM_HOST: whoami
      UPSTREAM_PORT: "80"
      LOG_LEVEL: info
    depends_on:
      - whoami

  whoami:
    image: traefik/whoami:v1.10
