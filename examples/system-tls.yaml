# Example system.yaml with TLS termination + HTTP/2 on the data plane
# (and optionally the admin API).
#
# The listener serves HTTPS; over the TLS connection it negotiates HTTP/2 or
# HTTP/1.1 via ALPN (h2 is preferred). Point cert_path/key_path at a PEM
# certificate chain and private key (PKCS#8, PKCS#1, or SEC1).
#
# Generate a self-signed pair for local testing:
#   openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem \
#     -days 365 -subj "/CN=localhost"

listener:
  bind: 0.0.0.0
  port: ${GATEWAY_PORT:-8443}

tls:
  cert_path: ${TLS_CERT:-/etc/gateway/tls/cert.pem}
  key_path: ${TLS_KEY:-/etc/gateway/tls/key.pem}
  min_version: ${TLS_MIN_VERSION:-1.2} # "1.2" or "1.3"

http2:
  enabled: true

admin:
  bind: 0.0.0.0
  port: ${ADMIN_PORT:-9090}
  username: ${ADMIN_USER:-admin}
  password: ${ADMIN_PASSWORD:-admin}
  # The admin listener can be TLS-terminated too (reuses the same TlsConfig).
  # Uncomment to serve the admin API/UI over HTTPS:
  # tls:
  #   cert_path: ${ADMIN_TLS_CERT:-/etc/gateway/tls/cert.pem}
  #   key_path: ${ADMIN_TLS_KEY:-/etc/gateway/tls/key.pem}

logging:
  level: ${LOG_LEVEL:-info}
  format: json
