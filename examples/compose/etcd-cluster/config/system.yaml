# Global settings. Not hot-reloaded — changes here need a container restart.

listener:
  bind: "0.0.0.0"
  port: ${GATEWAY_PORT:-8080}

logging:
  level: ${LOG_LEVEL:-info}
  format: text

admin:
  bind: "0.0.0.0"
  port: ${ADMIN_PORT:-9090}
  username: ${ADMIN_USER:-admin}
  password: ${ADMIN_PASSWORD:-admin}
  ui_enabled: true

# Config lives in etcd instead of the local gateway.yaml. Each instance loads
# from the same key prefix and polls it for changes; Admin API writes go to
# etcd, so they outlive the container.
config:
  source: etcd
  etcd:
    endpoints:
      - ${ETCD_ENDPOINT:-http://etcd:2379}
    prefix: ${ETCD_PREFIX:-/featherbit}
    # user: ${ETCD_USER:-}
    # password: ${ETCD_PASSWORD:-}
    timeout_ms: 3000
