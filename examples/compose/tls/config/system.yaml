# Global settings. Not hot-reloaded — changes here need a container restart.

listener:
  bind: "0.0.0.0"
  port: ${GATEWAY_PORT:-8443}

# The cert/key are read once at startup: a missing or unreadable file aborts
# the boot with a clear error rather than failing every handshake later. Over
# the TLS connection the listener negotiates HTTP/2 or HTTP/1.1 via ALPN.
tls:
  cert_path: /etc/gateway/tls/cert.pem
  key_path: /etc/gateway/tls/key.pem
  min_version: ${TLS_MIN_VERSION:-1.2} # "1.2" (default) or "1.3"

http2:
  enabled: true

logging:
  level: ${LOG_LEVEL:-info}
  format: text

admin:
  bind: "0.0.0.0"
  port: ${ADMIN_PORT:-9090}
  username: ${ADMIN_USER:-admin}
  password: ${ADMIN_PASSWORD:-admin}
  ui_enabled: true
  # The admin listener can be TLS-terminated too, reusing the same pair:
  # tls:
  #   cert_path: /etc/gateway/tls/cert.pem
  #   key_path: /etc/gateway/tls/key.pem
