# Minimal featherbit deployment: one gateway, one upstream.
#
#   docker compose -f examples/compose/minimal/compose.yaml up
#
# Nothing here is repo-specific — copy this directory anywhere and it runs.
# The gateway comes from the published image, and `config/` is bind-mounted, so
# editing config/gateway.yaml on the host hot-reloads the running container.
#
# Config lives on the filesystem (`config.source: file`, the default): it is
# whatever the mounted files say at every start, and Admin API or web UI edits
# apply to the running process only. See ../etcd-single for a stack whose
# config survives a restart.

services:
  gateway:
    image: featherbit/featherbit:${FEATHERBIT_TAG:-latest}
    command:
      - --system-config=/etc/gateway/system.yaml
      - --gateway-config=/etc/gateway/gateway.yaml
    ports:
      - "8080:8080" # data plane
      - "9090:9090" # admin API + web UI (admin/admin)
    volumes:
      - ./config:/etc/gateway:ro
    environment:
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
      UPSTREAM_HOST: whoami
      UPSTREAM_PORT: "80"
      LOG_LEVEL: info
    depends_on:
      - whoami

  # Stand-in for your own service: echoes the request it received, so you can
  # see exactly what the routing policy delivered upstream.
  whoami:
    image: traefik/whoami:v1.10
