# featherbit with etcd-backed config on a persistent volume.
#
#   docker compose -f examples/etcd-single/compose.yaml up
#
# The difference from ../minimal is where configuration *lives*. Here the
# gateway runs `config.source: etcd`, so routes, policies and consumers are
# stored in etcd rather than read from gateway.yaml on every start:
#
#   1. On first boot the etcd prefix is empty, so the gateway seeds it from the
#      mounted config/gateway.yaml (seed-if-empty bootstrap).
#   2. From then on etcd is the source of truth. Edits made through the Admin
#      API or the web UI are written to etcd, and the local gateway.yaml is
#      ignored.
#   3. etcd keeps its data in the named `etcd-data` volume, so those edits
#      survive `docker compose down` and `docker compose up` — unlike file mode,
#      where a restart reverts to whatever the file says.
#
# To start over from the file again, drop the volume: `docker compose ... down -v`.
#
# One etcd node and one gateway is the smallest useful shape. See
# ../etcd-cluster for several gateway replicas converging on the same prefix.

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 12

  gateway:
    image: featherbit/featherbit:${FEATHERBIT_TAG:-latest}
    command:
      - --system-config=/etc/gateway/system.yaml
      - --gateway-config=/etc/gateway/gateway.yaml
    ports:
      - "8080:8080" # data plane
      - "9090:9090" # admin API + web UI (admin/admin)
    volumes:
      - ./config:/etc/gateway:ro
    environment:
      ETCD_ENDPOINT: http://etcd:2379
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
      UPSTREAM_HOST: whoami
      UPSTREAM_PORT: "80"
      LOG_LEVEL: info
    depends_on:
      etcd:
        condition: service_healthy
      whoami:
        condition: service_started

  whoami:
    image: traefik/whoami:v1.10

volumes:
  etcd-data:
