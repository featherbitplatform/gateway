server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # API calls → gateway admin API
    location /api/ {
        proxy_pass http://gateway:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
        proxy_pass http://gateway:9090;
    }

    location /readyz {
        proxy_pass http://gateway:9090;
    }

    location /metrics {
        proxy_pass http://gateway:9090;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
