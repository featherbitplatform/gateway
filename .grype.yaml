# grype configuration — dependency/CVE scanning over the repo filesystem
# (Cargo.lock + the three npm lockfiles) and the built container image.
# High/critical findings fail the scan; lower severities are reported only.

fail-on-severity: high

# Directory scans: skip vendored/generated trees.
exclude:
  # Local planning notes (gitignored), incl. the vendored APISIX reference
  # copy (plan/apisix) — full of upstream fixtures with known CVEs.
  - ./plan/**
  - ./target/**
  - ./**/node_modules/**
  - ./ui/dist/**
  - ./website/build/**
  - ./website/.docusaurus/**
  - ./graphify-out/**
  - ./tests/pg-data-keycloak/**
  - ./sast-out/**

# Accepted findings, each with a comment explaining why.
ignore:
  # braces stack-exhaustion DoS on deeply nested glob patterns. Every
  # published version is flagged (3.0.3 is latest), so no upgrade exists;
  # pulled in via chokidar 3 (@docusaurus/core, webpack-dev-server), which
  # only expands the file-watch globs from this repo's docusaurus config at
  # docs build/dev time — not attacker-reachable, never in the shipped
  # binary/image. Remove once braces ships a fix or docusaurus moves to
  # chokidar 4+ (mirrors website/audit-ci.jsonc).
  - vulnerability: GHSA-vfj7-8cjw-p6xm
