# grype configuration — dependency/CVE scanning over the repo filesystem
# (Cargo.lock + the three npm lockfiles) and the built container image.
# High/critical findings fail the scan; lower severities are reported only.

fail-on-severity: high

# Directory scans: skip vendored/generated trees.
exclude:
  # Local planning notes (gitignored), incl. the vendored APISIX reference
  # copy (plan/apisix) — full of upstream fixtures with known CVEs.
  - ./plan/**
  - ./target/**
  - ./**/node_modules/**
  - ./ui/dist/**
  - ./website/build/**
  - ./website/.docusaurus/**
  - ./graphify-out/**
  - ./tests/pg-data-keycloak/**
  - ./sast-out/**

# Accepted findings, each with a comment explaining why.
ignore:
  # brace-expansion DoS (unbounded expansion OOM). Every release <= 5.0.7 is
  # vulnerable and the only patched version (5.0.8) is unreachable from the
  # minimatch 3.x range pinned by docusaurus' serve-handler. Build-time
  # tooling only — never in the shipped binary/image. Revisit when the
  # minimatch/serve-handler chain moves to brace-expansion >= 5.0.8.
  - vulnerability: GHSA-mh99-v99m-4gvg
