# grype configuration — dependency/CVE scanning over the repo filesystem
# (Cargo.lock + the three npm lockfiles) and the built container image.
# High/critical findings fail the scan; lower severities are reported only.

fail-on-severity: high

# Directory scans: skip vendored/generated trees.
exclude:
  # Local planning notes (gitignored), incl. the vendored APISIX reference
  # copy (plan/apisix) — full of upstream fixtures with known CVEs.
  - ./plan/**
  - ./target/**
  - ./**/node_modules/**
  - ./ui/dist/**
  - ./website/build/**
  - ./website/.docusaurus/**
  - ./graphify-out/**
  - ./tests/pg-data-keycloak/**
  - ./sast-out/**

# Accepted findings, each with a comment explaining why.
ignore:
  # image-size infinite-loop DoS on crafted ICNS/JXL/HEIF images. No patched
  # release exists (2.0.2 is latest and flagged); pulled in via
  # @docusaurus/mdx-loader, which only parses images checked into this repo
  # at docs build time — not attacker-reachable, never in the shipped
  # binary/image. Remove once image-size ships a fix and docusaurus picks
  # it up (mirrors website/audit-ci.jsonc).
  - vulnerability: GHSA-w3rx-r6r6-pgpr
  - vulnerability: GHSA-5p2g-fcmc-qvqq
