listener:
  bind: "0.0.0.0"
  port: ${GATEWAY_PORT:-8080}

http2:
  enabled: true

timeouts:
  connection_seconds: 30
  read_seconds: 30
  write_seconds: 30
  idle_seconds: 300

logging:
  level: ${LOG_LEVEL:-info}
  format: text

admin:
  bind: "0.0.0.0"
  port: ${ADMIN_PORT:-9090}
  username: ${ADMIN_USER:-admin}
  password: ${ADMIN_PASSWORD:-admin}
  # Serve the embedded web UI (node-graph editor). Set false for API-only
  # deployments; the -headless image never serves it regardless.
  ui_enabled: ${ADMIN_UI_ENABLED:-true}
  # Model Context Protocol server for AI agents (Claude Code, Cursor, …).
  # Off by default. Tokens are scoped: `read` = inspect config, traces and the
  # sandbox; `write` = also create/replace/delete routes, policies, supernodes,
  # plugin configs and stores. Generate tokens with `openssl rand -base64 32`.
  # mcp:
  #   enabled: ${FEATHERBIT_MCP_ENABLED:-false}
  #   path: /mcp
  #   tokens:
  #     - token: ${FEATHERBIT_MCP_READ_TOKEN}
  #       scope: read
  #       name: local-agent
  #     - token: ${FEATHERBIT_MCP_WRITE_TOKEN}
  #       scope: write
  #   allowed_origins: []

# Policy-execution tracing + the plugin sandbox. Off by default; toggling
# requires a restart (system.yaml is not hot-reloaded).
#
# Send `x-featherbit-debug: 1` on a request to trace it, then read the trace
# from GET /api/debug/traces on the admin port. Capturing bodies is the costly
# part and is gated separately -- bodies are also the one thing redaction
# cannot clean, so leave it off outside development.
#
# Every field can be driven by an env var -- interpolation is a text pass over
# this file before it is parsed, so it works for numbers and booleans alike.
# Keep the `:-` defaults: ${FEATHERBIT_DEBUG} with the variable unset expands to
# empty text, which YAML reads as null and serde rejects for a bool/number.
debug:
  enabled: ${FEATHERBIT_DEBUG:-false}
  trace_all: ${FEATHERBIT_DEBUG_TRACE_ALL:-false}
  capture_bodies: ${FEATHERBIT_DEBUG_BODIES:-false}
  max_traces: ${FEATHERBIT_DEBUG_MAX_TRACES:-50}

# Entry bound for proxy-cache's policy: local backend (process-wide, shared by
# every policy: local node). Once full, the entries expiring soonest are
# evicted -- watch gateway_cache_events_total{backend="local",event="eviction"}
# to see whether this is too small for your working set. Has no effect on
# policy: redis, which the store's own maxmemory policy bounds instead.
# cache:
#   max_entries: 10000

# Automatic TLS certificates via ACME (TLS-ALPN-01). Uncomment `acme:` and
# replace `tls.cert_path/key_path` with `tls.acme.domains`. Restart-gated.
# Experiment against Let's Encrypt STAGING first — production has strict
# duplicate-certificate rate limits.
# acme:
#   directory_url: https://acme-staging-v02.api.letsencrypt.org/directory
#   contact: ["mailto:ops@example.com"]
#   terms_of_service_agreed: true
#   key_type: ecdsa-p256
#   renew_before: 30d
#   storage:
#     type: filesystem
#     dir: /var/lib/featherbit/acme
# tls:
#   acme:
#     domains: [api.example.com]
